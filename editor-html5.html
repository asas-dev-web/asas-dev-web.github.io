<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Editor HTML em Tempo Real</title>
  <link rel="icon" href="/logo.png">
  <style>
    :root {
      --bg-color: #def;
      --text-color: #000;
      --border-color: #ccc;
      --editor-bg: #fff;
    }

    body.dark {
      --bg-color: #121212;
      --text-color: #eee;
      --border-color: #444;
      --editor-bg: #1e1e1e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      background: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
    }

    .toolbar button {
      padding: 6px 12px;
      cursor: pointer;
      background: var(--editor-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
    }

    .inputs {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      background-color: var(--bg-color);
    }

    .inputs input {
      padding: 6px;
      border: 1px solid var(--border-color);
      background: var(--editor-bg);
      color: var(--text-color);
    }

    .editor {
      flex: 1;
      padding: 10px;
      background-color: var(--bg-color);
    }

    textarea {
      width: 100%;
      height: 100%;
      font-family: monospace;
      font-size: 16px;
      resize: none;
      border: 1px solid var(--border-color);
      padding: 10px;
      background: var(--editor-bg);
      color: var(--text-color);
    }

    .preview {
      flex: 1;
      border-top: 2px solid var(--border-color);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Barra de ferramentas -->
    <div class="toolbar">
      <button onclick="clearEditor()">🧹 Limpar</button>
      <button onclick="copyToClipboard()">📋 Copiar</button>
      <button onclick="downloadHTML()">💾 Baixar</button>
      <button onclick="toggleTheme()">🌗 Tema Claro/Escuro</button>
    </div>

    <!-- Campos de links externos -->
    <div class="inputs">
      <input id="cssLink" type="text" placeholder="🔗 Link de CSS externo (opcional)">
      <input id="jsLink" type="text" placeholder="🔗 Link de JavaScript externo (opcional)">
    </div>

    <!-- Área de edição -->
    <div class="editor">
      <textarea id="editor"></textarea>
    </div>

    <!-- Área de visualização -->
    <div class="preview">
      <iframe id="preview"></iframe>
    </div>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const previewFrame = document.getElementById('preview');
    const cssLinkInput = document.getElementById('cssLink');
    const jsLinkInput = document.getElementById('jsLink');

    const defaultContent = `
<h3>Bem-vindo ao editor HTML em tempo real!</h3>
<p>Digite HTML na área de texto acima e ele aparecerá magicamente no quadro abaixo.</p>
`;

    const credits = `
<div style="position:absolute; bottom:0.5em; right:0.5em; font-size:small;">
  Criado por <a href="https://www.asasdev.com.br/" target="_blank">Alysson Almeida</a> e hospedado por 
  <a href="https://www.valuehost.com.br/cliente/aff.php?aff=1674" target="_blank">ValueHost</a>.
</div>
`;

    function loadEditorContent() {
      editor.value = localStorage.getItem('htmlEditorContent') || defaultContent;
      cssLinkInput.value = localStorage.getItem('htmlEditorCSS') || '';
      jsLinkInput.value = localStorage.getItem('htmlEditorJS') || '';
      updatePreview();
    }

    function updatePreview() {
      const htmlContent = editor.value;
      const cssURL = cssLinkInput.value.trim();
      const jsURL = jsLinkInput.value.trim();

      const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
      doc.open();

      // Cabeçalho com CSS externo (se fornecido)
      doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">`);
      if (cssURL) {
        doc.write(`<link rel="stylesheet" href="${cssURL}">`);
      }
      doc.write(`</head><body>`);
      doc.write(htmlContent);

      // Adiciona créditos se conteúdo for padrão
      if (htmlContent.replace(/\s/g, '') === defaultContent.replace(/\s/g, '')) {
        doc.write(credits);
      }

      // JS externo (se fornecido)
      if (jsURL) {
        doc.write(`<script src="${jsURL}"><\/script>`);
      }

      doc.write(`</body></html>`);
      doc.close();

      // Salvar no localStorage
      localStorage.setItem('htmlEditorContent', htmlContent);
      localStorage.setItem('htmlEditorCSS', cssURL);
      localStorage.setItem('htmlEditorJS', jsURL);
    }

    function clearEditor() {
      if (confirm("Deseja realmente limpar o conteúdo e links?")) {
        editor.value = '';
        cssLinkInput.value = '';
        jsLinkInput.value = '';
        updatePreview();
      }
    }

    function copyToClipboard() {
      navigator.clipboard.writeText(editor.value).then(() => {
        alert('Conteúdo copiado para a área de transferência!');
      });
    }

    function downloadHTML() {
      const blob = new Blob([editor.value], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'meu-html.html';
      a.click();
      URL.revokeObjectURL(url);
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
    }

    editor.addEventListener('input', updatePreview);
    cssLinkInput.addEventListener('input', updatePreview);
    jsLinkInput.addEventListener('input', updatePreview);
    window.addEventListener('DOMContentLoaded', loadEditorContent);
  </script>

</body>
</html>
